# Production Docker Compose for Oracle Cloud Free-Tier ARM VM
# ──────────────────────────────────────────────────────────────────────────────
# Services:
#   migrate  – one-shot alembic upgrade head (api depends on it)
#   api      – FastAPI / Uvicorn
#   worker   – Celery worker (same image, different CMD)
#   redis    – broker + result backend + rate-limit store
#   db       – PostgreSQL with pgvector extension
#   caddy    – HTTPS reverse-proxy (only service publishing ports 80/443)
#
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
# ──────────────────────────────────────────────────────────────────────────────

version: "3.9"

services:

  # ── Database ────────────────────────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    platform: linux/arm64
    restart: unless-stopped
    mem_limit: 2g
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-ragdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    platform: linux/arm64
    restart: unless-stopped
    mem_limit: 512m
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── One-shot migration ───────────────────────────────────────────────────────
  migrate:
    build:
      context: .
      target: runtime
    platform: linux/arm64
    image: rag-app:latest
    command: ["alembic", "upgrade", "head"]
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ragdb}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # ── API ──────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      target: runtime
    platform: linux/arm64
    image: rag-app:latest
    restart: unless-stopped
    mem_limit: 2.5g
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ragdb}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      STORAGE_BACKEND: postgres
      HF_HOME: /app/.cache/huggingface
    volumes:
      - hfcache:/app/.cache/huggingface
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ready | grep -q '\"warmed_up\":true' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    # Only Caddy is allowed to reach port 8000 — not exposed to host.

  # ── Celery worker ────────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      target: runtime
    platform: linux/arm64
    image: rag-app:latest
    mem_limit: 2.5g
    command:
      - celery
      - -A
      - app.workers.celery_app
      - worker
      - --loglevel=info
      - --concurrency=2
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ragdb}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      STORAGE_BACKEND: postgres
      HF_HOME: /app/.cache/huggingface
    volumes:
      - hfcache:/app/.cache/huggingface
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 30s

  # ── Caddy (HTTPS reverse proxy) ──────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    platform: linux/arm64
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    environment:
      API_DOMAIN: ${API_DOMAIN}
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
  hfcache:

