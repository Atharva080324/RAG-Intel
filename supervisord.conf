[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
user=root

[program:web]
command=sh -c 'uvicorn app.main:app --host 0.0.0.0 --port "${PORT:-7860}"'
directory=/usr/src/app
autostart=true
autorestart=true
startsecs=5
startretries=10
stdout_logfile=/tmp/hf-web.log
stderr_logfile=/tmp/hf-web.log

[program:worker]
command=celery -A app.workers.celery_app worker --loglevel=info
directory=/usr/src/app
autostart=true
autorestart=true
startsecs=5
startretries=10
stdout_logfile=/tmp/hf-worker.log
stderr_logfile=/tmp/hf-worker.log